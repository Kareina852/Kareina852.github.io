<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG 文案產生器 - Premium Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'sans-serif'],
                    },
                    colors: {
                        instagram: {
                            bg: '#FAFAFA',
                            card: '#FFFFFF',
                            accent: '#0095F6',
                            text: '#262626',
                            secondary: '#737373',
                            border: '#DBDBDB'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAFAFA;
            color: #262626;
            -webkit-font-smoothing: antialiased;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .post-card {
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.04), 0 2px 12px -1px rgba(0, 0, 0, 0.02);
        }
        .image-container img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }
        .copy-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Header -->
    <nav class="glass-nav sticky top-0 z-50 border-b border-gray-100 py-4 px-6 mb-8">
        <div class="max-w-screen-md mx-auto flex justify-between items-center">
            <h1 class="text-sm font-semibold tracking-[0.2em] uppercase text-gray-500">
                IG <span class="text-gray-900">文案產生器</span>
            </h1>
            <div class="flex gap-4">
                <div class="h-2 w-2 rounded-full bg-red-400"></div>
                <div class="h-2 w-2 rounded-full bg-yellow-400"></div>
                <div class="h-2 w-2 rounded-full bg-green-400"></div>
            </div>
        </div>
    </nav>

    <main class="max-w-screen-md mx-auto px-4 pb-20 animate-fade-in">
        
        <!-- Post Preview Card -->
        <div class="post-card bg-white rounded-3xl overflow-hidden border border-gray-100 animate-slide-up">
            
            <!-- User Info Header (Mock) -->
            <div class="p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px]">
                    <div class="w-full h-full rounded-full bg-white p-[2px]">
                        <div class="w-full h-full rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-400">AI</div>
                    </div>
                </div>
                <div>
                    <p class="text-sm font-semibold leading-none">Creator_Studio</p>
                    <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider font-medium">Suggested Content</p>
                </div>
                <button class="ml-auto p-2">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
            </div>

            <!-- Main Image Section -->
            <div class="image-container relative group px-2 sm:px-4">
                <div class="rounded-2xl overflow-hidden ring-1 ring-black/5 shadow-inner transition-transform duration-500 group-hover:scale-[1.01]">
                    <img src='https://opal.google/board/blobs/33d49058-9cbb-4238-a0d1-0532fba3c3e1' alt='media_1' class="w-full h-full object-cover" />
                </div>
            </div>

            <!-- Interaction Bar -->
            <div class="p-4 flex gap-4">
                <button class="hover:opacity-60 transition-opacity">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </button>
                <button class="hover:opacity-60 transition-opacity">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-14h1.1a8.38 8.38 0 0 1 3.9 1.1L21 3z"></path></svg>
                </button>
                <button class="hover:opacity-60 transition-opacity">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
                <button class="ml-auto hover:opacity-60 transition-opacity">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                </button>
            </div>

            <!-- Caption Section -->
            <div class="px-5 pb-8 space-y-4">
                <div class="caption-container relative bg-blue-50/30 rounded-2xl p-5 border border-blue-100/50">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest bg-blue-50 px-2 py-1 rounded">Generated Caption</span>
                        <button onclick="copyCaption()" class="copy-button p-2 bg-white rounded-lg shadow-sm border border-gray-100 text-gray-500 hover:text-instagram-accent transition-all duration-200 flex items-center gap-2 group">
                            <svg id="copyIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span class="text-xs font-semibold" id="copyText">複製</span>
                        </button>
                    </div>
                    
                    <div id="captionContent" class="text-instagram-text leading-relaxed whitespace-pre-wrap text-[15px] sm:text-[16px]">今天也被肉桂狗的大耳朵徹底治癒了 ☁️🩵

軟綿綿的樣子就像雲朵一樣，看著心情也跟著變甜了～☁️✨
快來跟 Cinnamoroll 一起飛進棉花糖的世界吧！🎐🧸

<span class="text-blue-600/80 mt-4 block">#Cinnamoroll #大耳狗 #三麗鷗 #肉桂狗 #喜拿狗 #可愛日常 #治癒系 #Sanrio #可愛 #少女心 #打卡 #萌物 #日常 #可愛圖案</span></div>
                </div>
            </div>
        </div>

        <!-- Action Area -->
        <div class="mt-12 flex flex-col sm:flex-row gap-4 justify-center items-center">
            <button onclick="location.reload()" class="w-full sm:w-auto px-8 py-4 bg-gray-900 text-white rounded-full font-semibold text-sm hover:bg-gray-800 transition-all hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                重新生成文案
            </button>
            <button class="w-full sm:w-auto px-8 py-4 bg-white text-gray-900 border border-gray-200 rounded-full font-semibold text-sm hover:bg-gray-50 transition-all flex items-center justify-center gap-2 shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                下載圖片
            </button>
        </div>
        
    </main>

    <script>
        function copyCaption() {
            const text = document.getElementById('captionContent').innerText;
            const copyText = document.getElementById('copyText');
            const copyIcon = document.getElementById('copyIcon');

            navigator.clipboard.writeText(text).then(() => {
                copyText.innerText = '已複製！';
                copyText.classList.add('text-green-500');
                copyIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
                copyIcon.classList.add('text-green-500');
                
                setTimeout(() => {
                    copyText.innerText = '複製';
                    copyText.classList.remove('text-green-500');
                    copyIcon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
                    copyIcon.classList.remove('text-green-500');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Add a subtle parallax-like effect to the image on mouse move (desktop)
        if (window.innerWidth > 768) {
            const card = document.querySelector('.post-card');
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 100;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 100;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            
            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
                card.style.transition = 'all 0.5s ease';
            });
            
            document.addEventListener('mouseenter', () => {
                card.style.transition = 'none';
            });
        }
    </script>
</body>
</html>
